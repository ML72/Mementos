name: Deploy to Azure

on:
  workflow_dispatch:  # Allows manual triggering
    inputs:
      environment:
        description: 'Target environment for deployment'
        required: true
        type: choice
        options:
          - dev
          - prod
  workflow_run:
    workflows: ["Pre-Deployment Tests"]
    types:
      - completed
    branches:
      - 'env-*'

env:
  NODE_VERSION: '20.11.0'

jobs:
  # Extract environment name from branch
  setup:
    runs-on: ubuntu-latest
    # Only run if tests passed or manual trigger
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      environment: ${{ steps.extract-env.outputs.environment }}
    steps:
      - name: Check test results
        if: github.event_name == 'workflow_run'
        run: |
          echo "Test workflow conclusion: ${{ github.event.workflow_run.conclusion }}"
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "❌ Tests did not pass. Deployment cancelled."
            exit 1
          fi
          echo "✅ Tests passed. Proceeding with deployment."

      - name: Extract environment from branch name
        id: extract-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV_NAME="${{ github.event.inputs.environment }}"
          else
            BRANCH_NAME="${{ github.event.workflow_run.head_branch }}"
            ENV_NAME="${BRANCH_NAME#env-}"
          fi
          echo "environment=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "Deploying to environment: $ENV_NAME"
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('env-{0}', github.event.inputs.environment) || github.event.workflow_run.head_branch }}

  # Build the application
  build:
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('env-{0}', github.event.inputs.environment) || github.event.workflow_run.head_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: |
          cd src/client
          npm ci --legacy-peer-deps

      - name: Build client
        run: npm run build:client
        env:
          NODE_ENV: production

      - name: Build server
        run: npm run build:server

      - name: Verify compiled server entry exists
        run: |
          if [ ! -f dist/index.js ]; then
            echo "dist/index.js is missing. Did the TypeScript build run?" >&2
            echo "Listing dist directory (if exists):"
            ls -la dist || true
            exit 1
          fi
          echo "Found dist/index.js"

      - name: Prune to production dependencies
        run: npm ci --omit=dev

      - name: Create deployment package
        run: |
          # Create a clean directory for deployment
          mkdir -p deploy
          
          # Copy server build (compiled TypeScript)
          cp -r dist deploy/
          
          # Copy client build (compiled React app)
          mkdir -p deploy/src/client
          cp -r src/client/dist deploy/src/client/
          
          # Include production node_modules
          cp -r node_modules deploy/

          # Copy necessary files
          cp package.json deploy/
          cp package-lock.json deploy/
          
          # Copy .env.example as reference (actual env vars set in Azure)
          cp .env.example deploy/ || echo "No .env.example found"
          
          # Create zip archive (preferred by Azure Zip Deploy)
          cd deploy
          zip -r ../deployment.zip .
          cd ..

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment.zip
          retention-days: 1

  # Deploy to Azure
  deploy:
    runs-on: ubuntu-latest
    needs: [setup, build]
    environment: ${{ needs.setup.outputs.environment }}
    
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets[format('AZURE_CREDENTIALS_{0}', needs.setup.outputs.environment)] }}

      - name: Deploy to Azure Web App (Zip Deploy)
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets[format('AZURE_WEBAPP_NAME_{0}', needs.setup.outputs.environment)] }}
          package: deployment.zip

      - name: Logout from Azure
        if: always()
        run: az logout

  # Post-deployment verification
  verify:
    runs-on: ubuntu-latest
    needs: [setup, deploy]
    
    steps:
      - name: Wait for deployment to stabilize
        run: sleep 60

      - name: Check application health
        run: |
          APP_URL="${{ secrets[format('AZURE_WEBAPP_URL_{0}', needs.setup.outputs.environment)] }}"
          
          echo "Checking health of: $APP_URL"
          
          # Check if the app is responding
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL" || echo "000")
          
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq "200" ] || [ "$HTTP_STATUS" -eq "301" ] || [ "$HTTP_STATUS" -eq "302" ]; then
            echo "✅ Application is responding correctly"
            exit 0
          else
            echo "❌ Application health check failed with status: $HTTP_STATUS"
            exit 1
          fi

      - name: Notify deployment status
        if: always()
        run: |
          ENV_NAME="${{ needs.setup.outputs.environment }}"
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to $ENV_NAME environment succeeded!"
          else
            echo "❌ Deployment to $ENV_NAME environment failed!"
          fi
